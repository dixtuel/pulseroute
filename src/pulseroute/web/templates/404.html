<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Link Not Found | PulseRoute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full text-center space-y-6">
        <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mx-auto text-2xl font-bold font-mono">
            404
        </div>
        <div class="space-y-2">
            <h1 class="text-2xl font-bold text-white tracking-tight">Short Link Not Found</h1>
            <p class="text-slate-400 text-sm">The link you are trying to access does not exist or has been deleted by its owner.</p>
        </div>
        <div class="pt-2">
            <a href="/dashboard" class="inline-block px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition">
                Return to Dashboard
            </a>
        </div>
        <p class="text-xs text-slate-600 font-mono">PulseRoute Edge Routing Engine</p>
    </div>
</body>
</html>
