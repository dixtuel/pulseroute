<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>410 — Link Expired | PulseRoute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        obsidian: '#07090A',
                        carbon: '#0E1316',
                        panel: '#141B1F',
                        divider: '#202A30',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #07090A; color: #E2E8F0; }
        .grid-bg {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(32, 42, 48, 0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(32, 42, 48, 0.3) 1px, transparent 1px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 grid-bg antialiased text-slate-200">
    <div class="max-w-md w-full text-center space-y-6 bg-carbon border border-divider p-8 rounded-xl shadow-2xl">
        <div class="w-14 h-14 rounded-xl bg-panel border border-rose-500/30 text-rose-400 flex items-center justify-center mx-auto text-xl font-bold font-mono">
            410
        </div>
        <div class="space-y-2">
            <h1 class="text-xl font-display font-bold text-white tracking-tight">Campaign / Link Expired</h1>
            <p class="text-slate-400 text-xs font-mono">The expiration threshold for this short URL has been reached.</p>
        </div>
        <div class="pt-2">
            <a href="/dashboard" class="inline-block px-5 py-2 rounded-lg bg-panel border border-divider hover:border-amber-500 text-slate-200 hover:text-white font-display font-bold text-xs uppercase tracking-wider transition">
                Return to Routing Console
            </a>
        </div>
        <p class="text-[10px] text-slate-600 font-mono">PulseRoute Retention Policy Engine</p>
    </div>
</body>
</html>
