services:
  - type: web
    name: pulseroute
    runtime: python
    buildCommand: pip install -e .
    startCommand: pulseroute serve --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
